name: Deploy Supabase Functions

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions: write-all

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_ID: ykbpkhsrxtnnisnorwhd

    steps:
      - uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy check-farm function
        run: |
          supabase functions deploy check-farm --project-ref $PROJECT_ID --no-verify-jwt --debug > deploy.log 2>&1 || true
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git checkout -B deploy-debug-branch
          git add deploy.log
          git commit -m "debug: supabase deploy log"
          git push origin deploy-debug-branch --force
