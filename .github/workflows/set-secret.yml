name: Set Supabase Secret

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/set-secret.yml'

jobs:
  set-secret:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_ID: ykbpkhsrxtnnisnorwhd
    steps:
      - uses: actions/checkout@v3
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Set Secret
        run: |
          echo "" | base64 -d > service-account.json
          JSON_VAL=cat service-account.json
          supabase secrets set FIREBASE_SERVICE_ACCOUNT="$JSON_VAL" --project-ref $PROJECT_ID