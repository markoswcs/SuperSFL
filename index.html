<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <script>
    window.onerror = function(msg, url, lineNo, columnNo, error) {
      alert('CRITICAL ERROR: ' + msg + '\nLine: ' + lineNo + '\nFile: ' + url);
      return false;
    };
    window.addEventListener('unhandledrejection', function(event) {
      alert('PROMISE ERROR: ' + (event.reason && event.reason.message ? event.reason.message : event.reason));
    });
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#F59E0B">
  <meta name="description" content="Dashboard completo para Sunflower Land: preços, fazenda, alertas e mercado P2P.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SFL Hub">
  
  <title>SFL Hub — Sunflower Land Dashboard</title>
  
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/styles.css?v=114">
  
  <!-- Icons -->
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/icon-192.png">
</head>
<body>
  <div id="app">
    
    <!-- Top Global Header -->
    <header class="top-header">
      <div class="app-logo">
        <img src="https://sfl.world/img/Flower.png" class="app-logo-img" alt="SFL" onerror="this.style.display='none'">
        <div class="app-logo-text">SFL<span>HUB</span></div>
      </div>
        <div class="header-actions">
          <span class="sync-time" id="sync-time">--:--</span>
          <button class="btn-sync" id="btn-global-sync">
            <svg class="sync-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>
          </button>
      </div>
    </header>

  
    <!-- Main Content Area -->
    <main class="page-content">
      
      <!-- FARM TAB -->
      <section id="tab-farm" class="tab-page active">
        <div id="home-sfl-card" class="mb-4"></div>
        <div id="home-farm-summary" class="mb-4"></div>
        <div id="home-upcoming" class="mb-4"></div>
        <div id="farm-content"></div>
      </section>

      <!-- MARKET TAB -->
      <section id="tab-market" class="tab-page">
        <div class="search-bar">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="market-search" class="search-input" placeholder="Search resources..." data-i18n="market_search">
        </div>
        <div class="filter-chips" data-target="market" id="market-filter-active" data-filter="portfolio">
          <div class="chip active" data-filter="portfolio">💼 Portfólio</div>
          <div class="chip" data-filter="opportunities">🔥 Oportunidades</div>
          <div class="chip" data-filter="history">📜 Histórico (P&L)</div>
        </div>
        <div id="market-grid" class="market-grid pb-5"></div>
      </section>

      <!-- DELIVERIES TAB -->
      <section id="tab-deliveries" class="tab-page">
        <div id="deliveries-content"></div>
      </section>

      <!-- ALERTS TAB -->
      <section id="tab-alerts" class="tab-page">
        <div id="notif-settings-content" class="mb-5"></div>
        <div class="section-header mb-3 mt-4">
          <div class="section-title" data-i18n="alerts_history">Alert History</div>
        </div>
        <div id="alerts-list" class="card" style="padding:0"></div>
      </section>


      <!-- SETTINGS TAB -->
      <section id="tab-settings" class="tab-page">
        <div id="settings-content"></div>
      </section>

    </main>

    <!-- GLOBAL MODAL -->
    <div id="app-modal" class="modal-backdrop" style="display:none">
      <div class="modal-content spring-in">
        <div class="modal-header">
          <div class="modal-title" id="modal-title">Title</div>
          <button class="modal-close" id="btn-modal-close">✕</button>
        </div>
        <div class="modal-body" id="modal-body"></div>
      </div>
    </div>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
      <button class="nav-item active" data-tab="farm">
        <div class="nav-icon"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m10 11 11 .9c.6 0 .9.5.8 1.1l-.8 5h-1"/><path d="M16 18h-5"/><path d="M18 5a1 1 0 0 0-1 1v5.573"/><path d="M3 4h9l1 7.246"/><path d="M4 11V4"/><path d="M7 15h.01"/><path d="M8 10.1V4"/><circle cx="18" cy="18" r="2"/><circle cx="7" cy="15" r="4"/></svg></div>
        <span class="nav-label" data-i18n="nav_farm">Farm</span>
      </button>
      <button class="nav-item" data-tab="market">
        <div class="nav-icon"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9h18v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V9Z"/><path d="m3 9 2.45-4.9A2 2 0 0 1 7.24 3h9.52a2 2 0 0 1 1.8 1.1L21 9"/><path d="M12 3v6"/></svg></div>
        <span class="nav-label">Mercado</span>
      </button>
      <button class="nav-item" data-tab="deliveries">
        <div class="nav-icon"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l2-1.14"/><path d="m7.5 4.27 9 5.15"/><polyline points="3.29 7 12 12 20.71 7"/><line x1="12" x2="12" y1="22" y2="12"/><circle cx="18.5" cy="15.5" r="2.5"/><path d="M20.27 17.27 22 19"/></svg></div>
        <span class="nav-label">Entregas</span>
      </button>
      <button class="nav-item" data-tab="alerts">
        <div class="nav-icon"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg></div>
        <span class="nav-label" data-i18n="nav_alerts">Alerts</span>
        <div class="nav-badge" id="alert-nav-badge" style="display:none">0</div>
      </button>
      <button class="nav-item" data-tab="settings">
        <div class="nav-icon"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg></div>
        <span class="nav-label" data-i18n="nav_settings">Config</span>
      </button>
    </nav>

  </div>

  <!-- PWA Install Banner -->
  <div id="pwa-install-banner" style="display:none; position:fixed; bottom:72px; left:12px; right:12px; z-index:9999; background:linear-gradient(135deg, #1a1f2e 0%, #0d1117 100%); border:1px solid rgba(245,158,11,0.4); border-radius:20px; padding:16px 18px; box-shadow:0 8px 32px rgba(0,0,0,0.5), 0 0 0 1px rgba(245,158,11,0.1); backdrop-filter:blur(20px); animation:slideUp 0.4s cubic-bezier(0.34,1.56,0.64,1);">
    <style>
      @keyframes slideUp { from { transform:translateY(20px); opacity:0; } to { transform:translateY(0); opacity:1; } }
    </style>
    <div style="display:flex; align-items:center; gap:14px;">
      <img src="icons/icon-192.png" style="width:48px; height:48px; border-radius:12px; flex-shrink:0;" onerror="this.src='https://sfl.world/img/Flower.png'">
      <div style="flex:1; min-width:0;">
        <div style="font-size:14px; font-weight:900; color:#fff; margin-bottom:2px;">Instalar SFL Hub</div>
        <div style="font-size:12px; color:rgba(255,255,255,0.5); line-height:1.4;">Acesse direto pela tela inicial do celular</div>
      </div>
      <button id="pwa-dismiss-btn" style="background:none; border:none; color:rgba(255,255,255,0.3); font-size:20px; cursor:pointer; padding:4px; line-height:1; flex-shrink:0;" aria-label="Fechar">&times;</button>
    </div>
    <div style="display:flex; gap:10px; margin-top:14px;">
      <button id="pwa-install-btn" style="flex:1; background:linear-gradient(135deg, #F59E0B, #d97706); color:#0A0D12; border:none; border-radius:12px; padding:12px; font-size:14px; font-weight:900; cursor:pointer; letter-spacing:0.3px;">📲 Instalar Agora</button>
    </div>
  </div>

  <!-- Dependencies -->
  <script src="js/Sortable.min.js"></script>

  <!-- App Entry Point -->
  <script src="js/market-costs.js?v=114"></script>
  <script type="module" src="js/app.js?v=114"></script>

  <!-- PWA: Service Worker + Install Prompt -->
  <script>
    // Register Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/SuperSFL/sw.js', { scope: '/SuperSFL/' })
          .then(reg => console.log('[SW] Registered:', reg.scope))
          .catch(err => console.warn('[SW] Registration failed:', err));
      });
    }

    // Capture the install prompt (Chrome/Android/Desktop)
    let _installPrompt = null;
    const banner = document.getElementById('pwa-install-banner');
    const installBtn = document.getElementById('pwa-install-btn');
    const dismissBtn = document.getElementById('pwa-dismiss-btn');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      _installPrompt = e;
      // Don't show if already dismissed this session
      if (!sessionStorage.getItem('pwa_dismissed')) {
        setTimeout(() => { if (banner) banner.style.display = 'block'; }, 1500);
      }
    });

    if (installBtn) {
      installBtn.addEventListener('click', async () => {
        if (_installPrompt) {
          _installPrompt.prompt();
          const { outcome } = await _installPrompt.userChoice;
          console.log('[PWA] User choice:', outcome);
          _installPrompt = null;
        }
        if (banner) banner.style.display = 'none';
      });
    }

    if (dismissBtn) {
      dismissBtn.addEventListener('click', () => {
        if (banner) banner.style.display = 'none';
        sessionStorage.setItem('pwa_dismissed', '1');
      });
    }

    // Hide banner if already installed (standalone mode)
    if (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone) {
      if (banner) banner.style.display = 'none';
    }
  </script>
</body>
</html>
