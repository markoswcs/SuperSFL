name: Deploy Supabase Functions

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_ID: ykbpkhsrxtnnisnorwhd

    steps:
      - uses: actions/checkout@v3

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy check-farm function
        run: |
          supabase functions deploy check-farm --project-ref $PROJECT_ID --no-verify-jwt --debug > deploy.log 2>&1 || true
          cat deploy.log

      - name: Upload deploy log
        uses: actions/upload-artifact@v3
        with:
          name: supabase-deploy-log
          path: deploy.log
