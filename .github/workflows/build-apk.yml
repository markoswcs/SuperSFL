name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Prepare WWW Folder
      run: |
        mkdir www
        cp -r css js images manifest.json index.html sw.js package.json capacitor.config.json www/ 2>/dev/null || true

    - name: Install dependencies
      run: npm install

    - name: Add Android platform
      run: |
        npx cap add android || exit 1
        npx cap sync android || exit 1
        cp google-services.json android/app/google-services.json || exit 1

    - name: Configure Web Settings for Cross-Origin (Iframe support)
      run: |
        cat << 'EOF' > android/app/src/main/java/com/sflpro/app/MainActivity.java
        package com.sflpro.app;
        import android.os.Bundle;
        import android.webkit.WebSettings;
        import android.webkit.WebView;
        import com.getcapacitor.BridgeActivity;

        public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                WebView webView = this.bridge.getWebView();
                WebSettings settings = webView.getSettings();
                settings.setJavaScriptEnabled(true);
                settings.setDomStorageEnabled(true);
                settings.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
            }
        }
        EOF

    - name: Build APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SFL-Pro-App
        path: android/app/build/outputs/apk/debug/app-debug.apk